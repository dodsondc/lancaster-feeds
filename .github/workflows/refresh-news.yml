name: Refresh township news

on:
  workflow_dispatch:
  schedule:
    # Twice daily, at 11:17 and 23:17 UTC (7:17 AM/PM EDT; 6:17 AM/PM EST).
    - cron: '17 11,23 * * *'
  push:
    branches: [main]
    paths:
      - 'Feed Maker.R'
      - 'R/**'
      - 'tests/**'
      - '.github/workflows/refresh-news.yml'

permissions:
  contents: write

concurrency:
  group: township-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::rvest
            any::xml2
            any::jsonlite
      - name: Check collector behavior
        run: |
          Rscript tests/test-news.R
          Rscript tests/test-meetings.R
      - name: Collect news and build RSS
        id: collect
        run: Rscript 'Feed Maker.R'
      - name: Publish feed and preserve collection history
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- lancaster_township_news.xml state
          if [ -f lancaster_township_meetings.xml ]; then
            git add lancaster_township_meetings.xml
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh township news feed and collection state'
            git push
          fi
