name: Refresh township news

on:
  workflow_dispatch:
  schedule:
    # Twice daily, at 11:17 and 23:17 UTC (7:17 AM/PM EDT; 6:17 AM/PM EST).
    - cron: '17 11,23 * * *'
  push:
    branches: [main]
    paths:
      - 'Feed Maker.R'
      - 'R/**'
      - 'tests/**'
      - '.github/workflows/refresh-news.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: township-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued/manual runs may carry an older triggering commit.
          # The concurrency group serializes runs; fetch current main at job start.
          ref: main
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::rvest
            any::xml2
            any::jsonlite
      - name: Check collector behavior
        run: |
          Rscript tests/test-news.R
          Rscript tests/test-meetings.R
          Rscript tests/test-conservancy.R
      - name: Collect news and build RSS
        id: collect
        env:
          # Set false for Conservancy-only collection (no Eventbrite requests).
          CONSERVANCY_EVENTBRITE: 'true'
        run: Rscript 'Feed Maker.R'
      - name: Publish feed and preserve collection history
        id: publish
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- lancaster_township_news.xml state
          if [ -f lancaster_township_meetings.xml ]; then
            git add lancaster_township_meetings.xml
          fi
          if [ -f lancaster_conservancy_events.xml ]; then
            git add lancaster_conservancy_events.xml
          fi
          if [ -d docs ]; then
            git add --all -- docs
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh township news feed and collection state'
            git push
          fi
      - name: Configure calendar-file hosting
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && hashFiles('docs/calendar/*.ics') != '' }}
        uses: actions/configure-pages@v5
      - name: Upload calendar files
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && hashFiles('docs/calendar/*.ics') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy calendar files
        id: deployment
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && hashFiles('docs/calendar/*.ics') != '' }}
        uses: actions/deploy-pages@v4
