name: Probe BoardDocs access
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public BoardDocs URLs
        shell: bash
        run: |
          base='https://go.boarddocs.com/pa/lanc/Board.nsf'
          for path in 'vpublic?open' 'goto?open&id=DXXLQE577871'; do
            printf '%s: ' "$path"
            curl --silent --show-error --location --max-time 20 \
              --output /dev/null --write-out 'HTTP %{http_code} (%{content_type})\n' \
              "$base/$path" || true
          done
